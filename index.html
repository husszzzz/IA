<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09060f">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(124,58,237,.35), transparent 35%),
        linear-gradient(180deg, #09060f 0%, #0d0915 100%);
      color: #fff;
      overflow: hidden;
    }

    button,
    textarea,
    select {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(9,6,15,.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#7c3aed,#a855f7);
      box-shadow: 0 8px 30px rgba(124,58,237,.35);
      font-size: 21px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
    }

    .brand-subtitle {
      color: #9f96ac;
      font-size: 11px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.045);
      color: #fff;
      border-radius: 13px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 22px 14px 150px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 4px;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.12);
      border-radius: 10px;
    }

    .welcome {
      min-height: calc(100vh - 210px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 10px;
    }

    .welcome-logo {
      width: 82px;
      height: 82px;
      border-radius: 26px;
      display: grid;
      place-items: center;
      font-size: 37px;
      margin-bottom: 20px;
      background: linear-gradient(135deg,#7c3aed,#c084fc);
      box-shadow:
        0 0 0 8px rgba(124,58,237,.07),
        0 20px 60px rgba(124,58,237,.35);
    }

    .welcome h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 900;
    }

    .welcome p {
      max-width: 430px;
      color: #aaa0b8;
      line-height: 1.8;
      margin: 12px 0 25px;
      font-size: 14px;
    }

    .suggestions {
      width: 100%;
      max-width: 620px;
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .suggestion {
      text-align: right;
      padding: 15px;
      color: #e9e3ef;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .suggestion:hover {
      border-color: rgba(168,85,247,.45);
      background: rgba(124,58,237,.09);
    }

    .suggestion strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .suggestion span {
      color: #93899e;
      font-size: 11px;
    }

    .message {
      display: flex;
      margin: 12px auto;
      max-width: 900px;
    }

    .message.user {
      justify-content: flex-start;
    }

    .message.ai {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(88%,760px);
      padding: 13px 15px;
      border-radius: 18px;
      line-height: 1.75;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: linear-gradient(135deg,#6d28d9,#7c3aed);
      border-bottom-left-radius: 6px;
      box-shadow: 0 8px 25px rgba(124,58,237,.2);
    }

    .ai .bubble {
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
      border-bottom-right-radius: 6px;
    }

    .meta {
      font-size: 10px;
      color: #8d8498;
      margin-top: 5px;
      padding: 0 5px;
    }

    .composer-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(
        to top,
        #09060f 60%,
        rgba(9,6,15,.92) 80%,
        transparent
      );
      z-index: 20;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px;
      background: rgba(24,17,35,.92);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
      backdrop-filter: blur(20px);
    }

    textarea {
      flex: 1;
      min-height: 44px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      color: #fff;
      background: transparent;
      padding: 11px 9px;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #81788b;
    }

    .send {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg,#7c3aed,#a855f7);
      box-shadow: 0 8px 25px rgba(124,58,237,.3);
    }

    .controls {
      max-width: 900px;
      margin: 7px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .model {
      color: #a79ead;
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 11px;
      max-width: 170px;
    }

    .model option {
      background: #160e20;
      color: white;
    }

    .clear {
      border: 0;
      background: transparent;
      color: #81788b;
      font-size: 11px;
      cursor: pointer;
    }

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 13px 16px;
      width: fit-content;
      margin: 12px auto;
      margin-right: 0;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 17px;
    }

    .typing.show {
      display: flex;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #a855f7;
      border-radius: 50%;
      animation: pulse 1.1s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulse {
      0%,100% { opacity: .25; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .error {
      color: #ff9d9d !important;
      border-color: rgba(255,80,80,.2) !important;
    }

    @media(max-width:600px) {
      .welcome h1 {
        font-size: 26px;
      }

      .suggestions {
        grid-template-columns: 1fr;
      }

      .bubble {
        max-width: 92%;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div class="logo">✦</div>

      <div>
        <div class="brand-title">NOVA AI</div>
        <div class="brand-subtitle">مساعد الذكاء الاصطناعي</div>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="clearTop" title="مسح المحادثة">⌫</button>
    </div>
  </header>

  <main class="chat" id="chat">

    <section class="welcome" id="welcome">

      <div class="welcome-logo">✦</div>

      <h1>مرحباً بك 👋</h1>

      <p>
        اسألني أي شيء، اكتب فكرة، اطلب شرحاً أو مساعدة بالبرمجة
        وسأحاول مساعدتك.
      </p>

      <div class="suggestions">

        <button class="suggestion"
          data-text="اشرح لي الذكاء الاصطناعي بطريقة بسيطة">
          <strong>🤖 اشرح لي الذكاء الاصطناعي</strong>
          <span>شرح بسيط وسهل</span>
        </button>

        <button class="suggestion"
          data-text="اكتب لي فكرة مشروع ويب احترافي">
          <strong>💡 فكرة مشروع</strong>
          <span>اقتراح مشروع ويب</span>
        </button>

        <button class="suggestion"
          data-text="ساعدني في كتابة كود JavaScript">
          <strong>💻 مساعدة برمجية</strong>
          <span>JavaScript والكود</span>
        </button>

        <button class="suggestion"
          data-text="لخص لي أهم أخبار التقنية">
          <strong>🧠 التقنية</strong>
          <span>أسئلة ومعلومات</span>
        </button>

      </div>
    </section>

    <div id="messages"></div>

    <div class="typing" id="typing">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </main>

  <div class="composer-wrap">

    <div class="composer">

      <textarea
        id="input"
        rows="1"
        placeholder="اكتب رسالتك هنا..."
        autocomplete="off"
      ></textarea>

      <button class="send" id="send" title="إرسال">➤</button>

    </div>

    <div class="controls">

      <select class="model" id="model">
        <option value="gpt-4o">GPT-4o</option>
        <option value="gpt-4o-mini">GPT-4o Mini</option>
        <option value="deepseek">DeepSeek</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      </select>

      <button class="clear" id="clearBottom">
        مسح المحادثة
      </button>

    </div>

  </div>

</div>

<script>
  const chat = document.getElementById("chat");
  const messagesBox = document.getElementById("messages");
  const welcome = document.getElementById("welcome");
  const input = document.getElementById("input");
  const sendButton = document.getElementById("send");
  const modelSelect = document.getElementById("model");
  const typing = document.getElementById("typing");

  let history = [];

  try {
    history = JSON.parse(localStorage.getItem("nova_ai_history") || "[]");
  } catch {
    history = [];
  }

  function escapeHTML(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function saveHistory() {
    localStorage.setItem(
      "nova_ai_history",
      JSON.stringify(history.slice(-20))
    );
  }

  function renderMessage(role, content) {
    const wrapper = document.createElement("div");

    wrapper.className =
      "message " + (role === "user" ? "user" : "ai");

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.innerHTML = escapeHTML(content);

    wrapper.appendChild(bubble);
    messagesBox.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
  }

  function renderHistory() {
    messagesBox.innerHTML = "";

    if (!history.length) {
      welcome.style.display = "flex";
      return;
    }

    welcome.style.display = "none";

    history.forEach(message => {
      renderMessage(message.role, message.content);
    });
  }

  function setTyping(value) {
    typing.classList.toggle("show", value);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage(text = null) {

    const message =
      text !== null
        ? text.trim()
        : input.value.trim();

    if (!message) return;

    if (text === null) {
      input.value = "";
      input.style.height = "auto";
    }

    welcome.style.display = "none";

    history.push({
      role: "user",
      content: message
    });

    renderMessage("user", message);
    saveHistory();

    sendButton.disabled = true;
    input.disabled = true;
    setTyping(true);

    try {

      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message,
          history: history.slice(-20),
          model: modelSelect.value
        })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "الخادم أرسل استجابة غير صالحة."
        );
      }

      if (!response.ok || !data.ok) {
        throw new Error(
          data.error || "حدث خطأ أثناء الاتصال بالخادم."
        );
      }

      const reply =
        data.reply ||
        "لم يتم استلام رد من الذكاء الاصطناعي.";

      history.push({
        role: "assistant",
        content: reply
      });

      renderMessage("assistant", reply);
      saveHistory();

    } catch (error) {

      renderMessage(
        "assistant",
        "⚠️ " + (
          error.message ||
          "حدث خطأ غير معروف."
        )
      );

    } finally {

      setTyping(false);
      sendButton.disabled = false;
      input.disabled = false;
      input.focus();
    }
  }

  function clearChat() {

    history = [];

    localStorage.removeItem("nova_ai_history");

    messagesBox.innerHTML = "";
    welcome.style.display = "flex";

    input.focus();
  }

  sendButton.addEventListener("click", () => {
    sendMessage();
  });

  input.addEventListener("keydown", event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }

  });

  input.addEventListener("input", () => {

    input.style.height = "auto";

    input.style.height =
      Math.min(input.scrollHeight, 150) + "px";

  });

  document.querySelectorAll(".suggestion")
    .forEach(button => {

      button.addEventListener("click", () => {

        input.value =
          button.dataset.text || "";

        input.focus();

        sendMessage();

      });

    });

  document.getElementById("clearTop")
    .addEventListener("click", clearChat);

  document.getElementById("clearBottom")
    .addEventListener("click", clearChat);

  renderHistory();
</script>

</body>
</html>
